name: Atlas Issue Assistant Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: issue-bot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: Triage, Analyze Logs & Generate Fix + AI Prompt
    if: >-
      github.actor != 'github-actions[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event_name == 'issues' ||
        (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          (
            contains(github.event.comment.body, '@atlas-bot') ||
            startsWith(github.event.comment.body, '/help') ||
            startsWith(github.event.comment.body, '/apk') ||
            startsWith(github.event.comment.body, '/version') ||
            startsWith(github.event.comment.body, '/prompt') ||
            startsWith(github.event.comment.body, '/close') ||
            startsWith(github.event.comment.body, '/reopen') ||
            startsWith(github.event.comment.body, '/label ')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run Atlas Diagnostic Issue Assistant (Logs, Device ID, Vision, Solutions & AI Prompt)
        uses: actions/github-script@v9
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const actor = context.actor;
            const isComment = context.eventName === 'issue_comment';
            const comment = context.payload.comment;
            const fullIssueContext = `${issue.title || ''}\n\n${issue.body || ''}`;
            const rawText = isComment ? `${comment.body || ''}\n\n---\nContext:\n${fullIssueContext}` : fullIssueContext;
            const trimmed = (isComment ? (comment.body || '') : rawText).trim();

            // Do not double-comment on automatic audit issues managed by bug-hunter.yml
            if (!isComment && (issue.body || '').includes('<!-- atlas-audit-slug:')) {
              core.info('Skipping automated audit issue.');
              return;
            }

            // Acknowledge interaction immediately with eyes reaction
            try {
              if (isComment) {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                  content: 'eyes',
                });
              } else {
                await github.rest.reactions.createForIssue({
                  owner,
                  repo,
                  issue_number: issue.number,
                  content: 'eyes',
                });
              }
            } catch (_) {}

            const frWords = /\b(bonjour|merci|problème|erreur|mise à jour|téléchargement|connexion|serveur|application|écran|bouton|paramètres|réglages|impossible|quand|comment|pourquoi|journaux|captures)\b/i;
            const isFrench = frWords.test(rawText);

            const authorAssoc = isComment
              ? (comment.author_association || '')
              : (issue.author_association || '');
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssoc);

            let latestRelease = null;
            try {
              const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
              latestRelease = data;
            } catch (_) {}

            const releaseTag = latestRelease ? latestRelease.tag_name : 'v1.1.0';
            const apkUrl = `https://github.com/${owner}/${repo}/releases/latest/download/atlas-commerce.apk`;

            // Handle slash commands in comments
            if (isComment) {
              if (trimmed.startsWith('/close')) {
                if (!isMaintainer && actor !== issue.user.login) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: isFrench
                      ? `Désolé @${actor}, seuls l'auteur du ticket ou un mainteneur peuvent fermer ce ticket.`
                      : `Sorry @${actor}, only the issue author or a repository maintainer can close this issue.`,
                  });
                  return;
                }
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: isFrench
                    ? `Ticket fermé par @${actor}. N'hésitez pas à commenter \`/reopen\` si le problème réapparaît !`
                    : `Closed by @${actor}. Feel free to comment \`/reopen\` anytime if this comes back!`,
                });
                return;
              }

              if (trimmed.startsWith('/reopen')) {
                if (!isMaintainer && actor !== issue.user.login) return;
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open' });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: isFrench
                    ? `Ticket rouvert par @${actor}.`
                    : `Issue reopened by @${actor}.`,
                });
                return;
              }

              if (trimmed.startsWith('/label ') && isMaintainer) {
                const labels = trimmed.slice(7).split(',').map((s) => s.trim()).filter(Boolean);
                if (labels.length > 0) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
                  await github.rest.reactions.createForIssueComment({
                    owner,
                    repo,
                    comment_id: comment.id,
                    content: 'rocket',
                  });
                }
                return;
              }

              if (trimmed.startsWith('/apk') || trimmed.startsWith('/version')) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: isFrench
                    ? `### Dernière version disponible : \`${releaseTag}\`\n- **Téléchargement direct APK :** [atlas-commerce.apk](${apkUrl})\n- **Dépôt Backend Web :** [Etherealmber/atlas-commerce](https://github.com/Etherealmber/atlas-commerce)`
                    : `### Latest Available Version: \`${releaseTag}\`\n- **Direct APK Download:** [atlas-commerce.apk](${apkUrl})\n- **Web Backend Repo:** [Etherealmber/atlas-commerce](https://github.com/Etherealmber/atlas-commerce)`,
                });
                return;
              }

              if (trimmed.startsWith('/help')) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    `### 🤖 Atlas Diagnostic & Issue Assistant — Commands`,
                    `- \`@atlas-bot <question>\` — Analyze logs, screenshots, root causes, and generate solutions + AI prompts`,
                    `- \`/prompt\` — Regenerate a ready-to-copy AI coding prompt for this issue`,
                    `- \`/version\` or \`/apk\` — Show the latest published release & direct \`atlas-commerce.apk\` link`,
                    `- \`/close\` / \`/reopen\` — Close or reopen this issue (author or maintainer)`,
                    `- \`/label <name>\` — Add labels to this issue (maintainers)`,
                  ].join('\n'),
                });
                return;
              }
            }

            // Parse structured telemetry, Device ID, logs & up to 3 attached images from issue/comment
            const reportIdMatch = rawText.match(/report_id=([A-Za-z0-9_-]+)/) || rawText.match(/Référence\s*:\*\*\s*`([^`]+)`/);
            const deviceIdMatch = rawText.match(/device_id=([A-Za-z0-9_-]+)/) || rawText.match(/Identifiant appareil[^`]*`([^`]+)`/i);
            const appVerMatch = rawText.match(/`(v[0-9]+\.[0-9]+[^`]*build\s*[0-9]+)`/i);
            const osMatch = rawText.match(/`(Android\s+[^`]+)`/i);
            const screenMatch = rawText.match(/`([0-9]+x[0-9]+px[^`]+)`/i);
            const logBlockMatch = rawText.match(/```(?:log|txt|stacktrace)?\s*([\s\S]*?)```/i);

            const extractedReportId = reportIdMatch ? reportIdMatch[1] : null;
            const extractedDeviceId = deviceIdMatch ? deviceIdMatch[1] : null;
            const extractedAppVer = appVerMatch ? appVerMatch[1] : null;
            const extractedOs = osMatch ? osMatch[1] : null;
            const extractedScreen = screenMatch ? screenMatch[1] : null;
            const extractedLogs = logBlockMatch ? logBlockMatch[1].trim().slice(-4000) : '';

            // Collect up to 3 attached GitHub screenshot URLs (`![...](https://...)` or `<img src="...">`)
            const imgUrls = [];
            const mdImgRegex = /!\[[^\]]*\]\((https:\/\/[^\s)]+)\)/g;
            const htmlImgRegex = /<img[^>]+src=["'](https:\/\/[^"']+)["']/gi;
            let m;
            while ((m = mdImgRegex.exec(rawText)) !== null && imgUrls.length < 3) {
              if (!imgUrls.includes(m[1])) imgUrls.push(m[1]);
            }
            while ((m = htmlImgRegex.exec(rawText)) !== null && imgUrls.length < 3) {
              if (!imgUrls.includes(m[1])) imgUrls.push(m[1]);
            }

            const isDiagnosticReport = Boolean(
              rawText.includes('<!-- atlas-diag-v1') ||
              /\[diag\]/i.test(issue.title || '') ||
              extractedReportId ||
              extractedDeviceId ||
              extractedLogs.length > 0 ||
              trimmed.startsWith('/prompt')
            );

            // Classify topic & ensure repository labels exist
            const LABEL_DEFS = {
              'bug': { color: 'd73a4a', description: 'Crash, freeze, UI clipping, error, or unexpected behavior' },
              'diagnostic-report': { color: '0052cc', description: 'Automated telemetry, Device ID & log bundle from Android app' },
              'enhancement': { color: '0e8a16', description: 'New feature, UI polish, or improvement idea' },
              'question': { color: '0075ca', description: 'Setup question or usage guidance' },
              'update-cdn': { color: 'fbca04', description: 'In-app updater, parallel HTTP Range download, or CDN 1 sync' },
              'auth-server': { color: '5319e7', description: 'Server URL, login, e-mail verify link, or QR session' },
              'camera-scan': { color: '1d76db', description: 'Barcode scanner, CameraX, or QR device pairing' },
              'security': { color: 'b60205', description: 'Security, credentials, or session isolation' },
            };

            const lower = rawText.toLowerCase();
            const detectedLabels = new Set();

            if (isDiagnosticReport) {
              detectedLabels.add('bug');
              detectedLabels.add('diagnostic-report');
            } else if (/(crash|exception|freeze|frozen|stuck|bug|broken|fail|error|erreur|plant|bloqu|coupé|ne marche pas)/i.test(lower)) {
              detectedLabels.add('bug');
            } else if (/(feature|idea|add|improve|overhaul|option|dropdown|ui|ux|design|ajout|idée|amélior)/i.test(lower)) {
              detectedLabels.add('enhancement');
            } else {
              detectedLabels.add('question');
            }

            if (/(update|apk|cdn|download|progress|install|r2|latest\.json|mise à jour|télécharg)/i.test(lower)) {
              detectedLabels.add('update-cdn');
            }
            if (/(login|otp|email|verify|server|worker|token|account|serveur|connexion|compte)/i.test(lower)) {
              detectedLabels.add('auth-server');
            }
            if (/(scan|camera|barcode|qr|device|caméra|code-barres|appareil)/i.test(lower)) {
              detectedLabels.add('camera-scan');
            }

            const secretLeakPattern = /(ghp_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9_]{25,}|Bearer\s+[A-Za-z0-9._-]{25,}|AKIA[0-9A-Z]{16})/;
            const hasPotentialSecret = secretLeakPattern.test(rawText);
            if (hasPotentialSecret) {
              detectedLabels.add('security');
            }

            if (!isComment && detectedLabels.size > 0) {
              for (const lbl of detectedLabels) {
                const meta = LABEL_DEFS[lbl];
                if (!meta) continue;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: lbl,
                    color: meta.color,
                    description: meta.description,
                  });
                } catch (_) {}
              }
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: Array.from(detectedLabels),
                });
              } catch (_) {}
            }

            // Look for related existing issues in the repository
            let relatedLines = [];
            if (!isComment) {
              try {
                const words = (issue.title || '')
                  .toLowerCase()
                  .replace(/[^a-z0-9àâçéèêëîïôûùüÿñæœ\s]/gi, ' ')
                  .split(/\s+/)
                  .filter((w) => w.length >= 4 && w !== 'diag');
                if (words.length > 0) {
                  const { data: recentIssues } = await github.rest.issues.listForRepo({
                    owner,
                    repo,
                    state: 'all',
                    per_page: 30,
                  });
                  const scored = recentIssues
                    .filter((i) => !i.pull_request && i.number !== issue.number)
                    .map((i) => {
                      const hay = `${i.title} ${i.body || ''}`.toLowerCase();
                      const hits = words.filter((w) => hay.includes(w)).length;
                      return { item: i, hits };
                    })
                    .filter((x) => x.hits >= 2)
                    .sort((a, b) => b.hits - a.hits)
                    .slice(0, 3);
                  relatedLines = scored.map(
                    ({ item }) => `- #${item.number} — **${item.title}** (\`${item.state}\`)`,
                  );
                }
              } catch (_) {}
            }

            // Map keywords to likely Kotlin source files in Etherealmber/atlas-commerce-android
            const candidateFiles = [];
            if (/(agent|table|markdown|quota)/i.test(lower)) {
              candidateFiles.push(
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/components/AtlasComponents.kt',
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/screens/agent/AgentScreen.kt',
              );
            }
            if (/(profil|param|setting|avatar|photo)/i.test(lower)) {
              candidateFiles.push(
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/screens/settings/SettingsScreen.kt',
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/components/AtlasAvatar.kt',
              );
            }
            if (/(update|mise à jour|télécharg|cdn|apk)/i.test(lower)) {
              candidateFiles.push(
                'app/src/main/java/ma/etherealmber/atlascommerce/core/update/AppUpdateManager.kt',
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/components/AppUpdateUi.kt',
              );
            }
            if (/(scan|caméra|camera|qr)/i.test(lower)) {
              candidateFiles.push(
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/screens/scan/ScanScreen.kt',
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/components/BarcodeCameraView.kt',
              );
            }
            if (/(licen|about|propos|etherealmber)/i.test(lower)) {
              candidateFiles.push(
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/screens/legal/LegalScreens.kt',
                'app/src/main/java/ma/etherealmber/atlascommerce/core/AppDetails.kt',
              );
            }
            if (candidateFiles.length === 0) {
              candidateFiles.push(
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/root/AtlasRoot.kt',
                'app/src/main/java/ma/etherealmber/atlascommerce/ui/components/AtlasComponents.kt',
              );
            }

            // Query GitHub Models AI (multimodal with up to 3 user screenshots when attached!)
            let aiGuidance = '';
            try {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 18000);
              const systemPrompt = [
                'You are @atlas-bot, the official senior Android diagnostic engineer & maintainer assistant for Etherealmber/atlas-commerce-android (Kotlin + Jetpack Compose + Hilt + OkHttp + Moshi).',
                `Latest release tag: ${releaseTag}. Direct APK URL: ${apkUrl}.`,
                `Candidate files in repo: ${candidateFiles.join(', ')}.`,
                'Analyze ALL provided device telemetry, Device ID, Android SDK/display metrics, logs/stacktraces, and attached screenshots (up to 3).',
                'Structure your response with these EXACT Markdown sections in the same language as the issue (French if French, English if English):',
                '1. ### 🔍 Cause racine probable / Root Cause Analysis (precise technical explanation from logs/UI metrics)',
                '2. ### 🛠️ Solutions recommandées / Recommended Solutions (concrete steps for both user & Kotlin/Compose fix)',
                '3. ### 🤖 Prompt IA prêt à copier / Ready-to-Copy AI Prompt — inside a ```text ... ``` fenced block containing issue summary, Device ID/OS/screen context, exact target files in Etherealmber/atlas-commerce-android, step-by-step fix instructions, and verification tests (while keeping app/build.gradle.kts version untouched).',
              ].join('\n');

              const userContentParts = [
                {
                  type: 'text',
                  text: `Issue #${issue.number}: ${issue.title}\n\n${rawText.slice(0, 7000)}`,
                },
                ...imgUrls.map((url) => ({
                  type: 'image_url',
                  image_url: { url },
                })),
              ];

              const resp = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  temperature: 0.2,
                  max_tokens: 900,
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userContentParts },
                  ],
                }),
                signal: controller.signal,
              });
              clearTimeout(timer);
              if (resp.ok) {
                const data = await resp.json();
                aiGuidance = (data.choices?.[0]?.message?.content || '').trim();
              }
            } catch (_) {}

            // Deterministic complete fallback (Root Cause + Solutions + Ready-to-Copy AI Prompt)
            if (!aiGuidance) {
              const promptBlock = [
                '```text',
                `Fix GitHub Issue #${issue.number} in Etherealmber/atlas-commerce-android: "${issue.title}"`,
                `Diagnostic Context:`,
                `- Report ID: ${extractedReportId || 'N/A'} | Device ID: ${extractedDeviceId || 'N/A'}`,
                `- Build: ${extractedAppVer || releaseTag} | OS: ${extractedOs || 'Android'} | Display: ${extractedScreen || ' mobile'}`,
                `- Attached screenshots: ${imgUrls.length}`,
                `Target files to inspect first:`,
                ...candidateFiles.map((f) => `- ${f}`),
                `Captured Log Excerpt:`,
                extractedLogs ? extractedLogs.slice(-900) : '(see issue body)',
                `Requirements:`,
                `1. Identify and fix the root cause without introducing unsafe !!, GlobalScope, or UI runBlocking.`,
                `2. Keep LegacySourceQuarantine.java and bug-hunter.yml file counts synchronized and keep app/build.gradle.kts version untouched.`,
                `3. Add/update unit tests in app/src/test/ and verify :app:testDebugUnitTest + :app:lintDebug pass with 0 warnings.`,
                '```',
              ].join('\n');

              aiGuidance = isFrench
                ? [
                    '### 🔍 Analyse rapide du rapport',
                    `- **Fichiers cibles identifiés :** ${candidateFiles.map((f) => `\`${f}\``).join(', ')}`,
                    extractedLogs
                      ? `- **Journaux reçus :** \`${extractedLogs.split('\n').length}\` lignes analysées.`
                      : `- **Dernière version publiée :** \`${releaseTag}\` ([atlas-commerce.apk](${apkUrl})).`,
                    '',
                    '### 🛠️ Solutions recommandées',
                    '- Vérifiez que vous utilisez la dernière version publiée dans **Mon profil → ⚙️ Paramètres → Mise à jour & Miroirs CDN**.',
                    '- Inspectez la mise en page Compose / états réseau dans les fichiers ci-dessus selon les métriques `dpi` / `fontScale` et les traces HTTP capturées.',
                    '',
                    '### 🤖 Prompt IA prêt à copier',
                    promptBlock,
                  ].join('\n')
                : [
                    '### 🔍 Diagnostic Triage Summary',
                    `- **Likely target files:** ${candidateFiles.map((f) => `\`${f}\``).join(', ')}`,
                    `- **Latest release:** \`${releaseTag}\` ([atlas-commerce.apk](${apkUrl})).`,
                    '',
                    '### 🛠️ Recommended Solutions',
                    '- Verify you are running the latest build via **Profile → ⚙️ Settings → Updates & CDN Mirrors**.',
                    '- Inspect the candidate Compose/network files above against the captured `dpi`/`fontScale` metrics and HTTP log lines.',
                    '',
                    '### 🤖 Ready-to-Copy AI Prompt',
                    promptBlock,
                  ].join('\n');
            }

            const lines = [];
            lines.push(
              isFrench
                ? `Bonjour @${actor} 👋 Merci pour ce signalement détaillé !`
                : `Hi @${actor} 👋 Thanks for the detailed report!`,
            );
            lines.push('');

            if (extractedReportId || extractedDeviceId || extractedAppVer || imgUrls.length > 0) {
              lines.push(isFrench ? '### 📱 Récapitulatif télémétrie capturée' : '### 📱 Captured Telemetry Summary');
              if (extractedReportId) lines.push(`- **Référence :** \`${extractedReportId}\``);
              if (extractedDeviceId) lines.push(`- **ID Appareil (anonymisé) :** \`${extractedDeviceId}\``);
              if (extractedAppVer) lines.push(`- **Version App :** \`${extractedAppVer}\``);
              if (extractedOs) lines.push(`- **Système :** \`${extractedOs}\``);
              if (extractedScreen) lines.push(`- **Écran / Échelle :** \`${extractedScreen}\``);
              lines.push(`- **Captures jointes détectées :** \`${imgUrls.length}/3\``);
              lines.push('');
            }

            if (hasPotentialSecret) {
              lines.push(
                isFrench
                  ? '> ⚠️ **Alerte Sécurité :** Votre message semble contenir un jeton ou secret d\'API. Par précaution, supprimez-le et régénérez la clé concernée.'
                  : '> ⚠️ **Security Notice:** Your message may contain a token or credential. Please remove it and rotate that secret right away.',
              );
              lines.push('');
            }

            lines.push(aiGuidance);

            if (relatedLines.length > 0) {
              lines.push('');
              lines.push(isFrench ? '#### 🔎 Tickets potentiellement liés' : '#### 🔎 Potentially Related Issues');
              lines.push(...relatedLines);
            }

            lines.push('');
            lines.push('---');
            lines.push(
              isFrench
                ? `_🤖 **Atlas Diagnostic Bot** · Commentez \`@atlas-bot <question>\` ou \`/prompt\` à tout moment._`
                : `_🤖 **Atlas Diagnostic Bot** · Comment \`@atlas-bot <question>\` or \`/prompt\` anytime._`,
            );

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: lines.join('\n'),
            });
