name: Android CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Needed to publish the build log back to the branch when compilation fails.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; install the exact platform we compile
      # against when cmdline-tools are available, otherwise let AGP auto-download.
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest \
            --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Compiler output is the only way to debug without an Android SDK locally,
      # so on failure the tail of the log is committed to the branch.
      - name: Publish failure log
        if: steps.build.outcome == 'failure' && github.ref_name != 'main'
        run: |
          mkdir -p ci-logs
          tail -n 600 "$RUNNER_TEMP/build.log" > ci-logs/build.log
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      # Shipping sanity: R8 + resource shrinking on the release variant. Kept
      # non-blocking so a shrinker warning never hides the debug signal.
      - name: Assemble release (R8, unsigned)
        continue-on-error: true
        run: gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tail -n 80

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Report build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed — see ci-logs/build.log on the branch (published by the previous step)."
          exit 1

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Lint (non blocking)
        run: gradle :app:lintDebug --no-daemon --console=plain || true
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
