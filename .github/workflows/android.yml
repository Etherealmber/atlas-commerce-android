name: Android CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Read-only by default; only the build job may publish a failure log back to the branch.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scoped to this job only: the failure log is committed back to the branch.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; install the exact platform we compile
      # against when cmdline-tools are available, otherwise let AGP auto-download.
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Builds debug, runs JUnit tests, and builds the R8 + resource-shrinking
      # release variant in one log so any debug or release KSP/R8 failure is captured.
      - name: Build, test, and assemble release (R8)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :buildSrc:test :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease \
            --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Compiler output is the only way to debug without an Android SDK locally,
      # so on failure the tail of the log is committed to the branch.
      - name: Publish failure log
        # Push events only: on pull_request the ref is a detached `<n>/merge`, and
        # fork PRs have a read-only token. A failed publish must never mask the
        # real build error, hence continue-on-error.
        if: steps.build.outcome == 'failure' && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -n 600 "$RUNNER_TEMP/build.log" > ci-logs/build.log
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Report build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed — see ci-logs/build.log on the branch (published by the previous step)."
          exit 1

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Exercise JDK 21 too (matches Android Studio Ladybug+ bundled JBR on Windows/macOS).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify legacy 1.0.4 source quarantine, KSP release & Android Lint
        # Simulates a dirty local 1.0.4 working tree after `git pull` (leftover
        # push/AtlasFirebaseMessagingService.kt + stale Hilt module), verifies
        # automatic quarantine, and runs kspReleaseKotlin + lintDebug under JDK 21.
        run: |
          mkdir -p app/src/main/java/ma/etherealmber/atlascommerce/push
          cat > app/src/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt <<'EOF'
          package ma.etherealmber.atlascommerce.push
          import com.google.firebase.messaging.FirebaseMessagingService
          import dagger.hilt.android.AndroidEntryPoint
          import javax.inject.Inject

          @AndroidEntryPoint
          class AtlasFirebaseMessagingService : FirebaseMessagingService() {
              @Inject lateinit var pushTokenRegistrar: PushTokenRegistrar
          }
          EOF
          cat > app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt <<'EOF'
          package ma.etherealmber.atlascommerce.di
          import dagger.Module
          import dagger.hilt.InstallIn
          import dagger.hilt.components.SingletonComponent

          @Module
          @InstallIn(SingletonComponent::class)
          object LegacyNetworkModule
          EOF
          touch -d '2026-10-21T20:08:04Z' app/src/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt
          touch -d '2026-10-21T20:08:04Z' app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt

          gradle :app:kspReleaseKotlin :app:lintDebug --no-daemon --console=plain

          test ! -e app/src/main/java/ma/etherealmber/atlascommerce/push
          test ! -e app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt
          test -f .atlas-1.0.4-quarantine/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt
          test -f .atlas-1.0.4-quarantine/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
