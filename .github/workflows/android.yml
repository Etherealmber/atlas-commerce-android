name: Android CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Read-only by default; only jobs that publish diagnostics carry write permission.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build, test, and assemble release (R8)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :buildSrc:test :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease \
            --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish failure log
        if: steps.build.outcome == 'failure' && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -n 600 "$RUNNER_TEMP/build.log" > ci-logs/build.log
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Report build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed — see ci-logs/build.log on the branch."
          exit 1

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify legacy 1.0.4 source quarantine, KSP release & Android Lint
        run: |
          mkdir -p app/src/main/java/ma/etherealmber/atlascommerce/push
          cat > app/src/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt <<'EOF'
          package ma.etherealmber.atlascommerce.push
          import com.google.firebase.messaging.FirebaseMessagingService
          import dagger.hilt.android.AndroidEntryPoint
          import javax.inject.Inject

          @AndroidEntryPoint
          class AtlasFirebaseMessagingService : FirebaseMessagingService() {
              @Inject lateinit var pushTokenRegistrar: PushTokenRegistrar
          }
          EOF
          cat > app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt <<'EOF'
          package ma.etherealmber.atlascommerce.di
          import dagger.Module
          import dagger.hilt.InstallIn
          import dagger.hilt.components.SingletonComponent

          @Module
          @InstallIn(SingletonComponent::class)
          object LegacyNetworkModule
          EOF
          touch -d '2026-10-21T20:08:04Z' app/src/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt
          touch -d '2026-10-21T20:08:04Z' app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt

          mv .git "$RUNNER_TEMP/hidden-git"
          gradle :app:kspReleaseKotlin :app:lintDebug --no-daemon --console=plain
          mv "$RUNNER_TEMP/hidden-git" .git

          test ! -e app/src/main/java/ma/etherealmber/atlascommerce/push
          test ! -e app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt
          test -f .atlas-1.0.4-quarantine/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt
          test -f .atlas-1.0.4-quarantine/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  android14-smoke:
    name: Android 14 release APK launch & upgrade check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: atlas-commerce-release-apk
          path: release-apk

      - name: Sign release APK & launch on Android 14 (API 34) emulator
        id: smoke
        continue-on-error: true
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          ADB="$SDK_ROOT/platform-tools/adb"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "emulator" "build-tools;35.0.0" "platforms;android-34" "system-images;android-34;default;x86_64"

          RAW_APK=$(ls release-apk/*.apk | head -n 1)
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/smoke.jks" \
            -alias smoke \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Atlas Release Smoke,O=Atlas,C=MA"
          "$ZIPALIGN" -f -p 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/smoke.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/app-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify -v "$RUNNER_TEMP/app-release-signed.apk"

          echo "no" | "$AVDM" create avd \
            --force \
            --name atlas_api34 \
            --package "system-images;android-34;default;x86_64" \
            --abi x86_64

          nohup "$SDK_ROOT/emulator/emulator" \
            -avd atlas_api34 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &

          "$ADB" wait-for-device
          for i in $(seq 1 90); do
            BOOT=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              break
            fi
            sleep 2
          done
          "$ADB" shell input keyevent 82 || true
          sleep 3

          # 1. Clean install & cold launch of R8-minified release APK on Android 14
          "$ADB" logcat -c
          "$ADB" install -r "$RUNNER_TEMP/app-release-signed.apk"
          "$ADB" shell am start -W -n ma.etherealmber.atlascommerce/.MainActivity
          sleep 8

          "$ADB" logcat -d > "$RUNNER_TEMP/smoke-logcat.txt"
          PID1=$("$ADB" shell pidof ma.etherealmber.atlascommerce | tr -d '\r' || true)
          echo "Android 14 cold launch PID: $PID1"

          if grep -Fq "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt"; then
            grep -A 50 -F "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt" > "$RUNNER_TEMP/smoke-failure.log"
            cat "$RUNNER_TEMP/smoke-failure.log"
            exit 1
          fi
          test -n "$PID1"

          "$ADB" shell uiautomator dump /sdcard/ui1.xml
          "$ADB" shell cat /sdcard/ui1.xml > "$RUNNER_TEMP/ui1.xml"
          grep -Fq "Atlas Commerce" "$RUNNER_TEMP/ui1.xml"

          # 2. Simulate upgrading over corrupted/legacy 1.0.4 DataStore on Android 14
          "$ADB" root || true
          sleep 2
          "$ADB" shell am force-stop ma.etherealmber.atlascommerce
          "$ADB" shell "mkdir -p /data/data/ma.etherealmber.atlascommerce/files/datastore && printf 'corrupt-legacy-1.0.4-datastore-bytes\xff\x00\xfe' > /data/data/ma.etherealmber.atlascommerce/files/datastore/atlas_prefs.preferences_pb" || true
          APP_UID=$("$ADB" shell stat -c '%u:%g' /data/data/ma.etherealmber.atlascommerce | tr -d '\r' || true)
          if [ -n "$APP_UID" ]; then
            "$ADB" shell "chown -R $APP_UID /data/data/ma.etherealmber.atlascommerce/files" || true
          fi

          "$ADB" logcat -c
          "$ADB" install -r "$RUNNER_TEMP/app-release-signed.apk"
          "$ADB" shell am start -W -n ma.etherealmber.atlascommerce/.MainActivity
          sleep 8

          "$ADB" logcat -d >> "$RUNNER_TEMP/smoke-logcat.txt"
          PID2=$("$ADB" shell pidof ma.etherealmber.atlascommerce | tr -d '\r' || true)
          echo "Android 14 post-upgrade launch PID: $PID2"

          if grep -Fq "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt"; then
            grep -A 50 -F "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt" > "$RUNNER_TEMP/smoke-failure.log"
            cat "$RUNNER_TEMP/smoke-failure.log"
            exit 1
          fi
          test -n "$PID2"

          "$ADB" shell uiautomator dump /sdcard/ui2.xml
          "$ADB" shell cat /sdcard/ui2.xml > "$RUNNER_TEMP/ui2.xml"
          grep -Fq "Atlas Commerce" "$RUNNER_TEMP/ui2.xml"

          "$ADB" emu kill || true

      - name: Publish smoke failure log
        if: steps.smoke.outcome == 'failure' && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -n 500 "$RUNNER_TEMP/smoke-logcat.txt" > ci-logs/android14-logcat.log || true
          tail -n 120 "$RUNNER_TEMP/emulator.log" > ci-logs/emulator.log || true
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/
          git commit -m "ci: android 14 smoke log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Android 14 logcat & UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-smoke-diagnostics
          path: |
            ${{ runner.temp }}/smoke-logcat.txt
            ${{ runner.temp }}/ui1.xml
            ${{ runner.temp }}/ui2.xml
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore

      - name: Report Android 14 smoke result
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Android 14 release launch smoke test failed — see ci-logs/ on branch."
          exit 1
