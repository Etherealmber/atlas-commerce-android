name: Android CI

on:
  push:
    branches: ['main', 'arena/**']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Read-only by default; only jobs that publish diagnostics or releases carry write permission.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app version metadata
        id: meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          code = re.search(r'versionCode\s*=\s*(\d+)', text).group(1)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          print(f"version_code={code}")
          print(f"version_name={name}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure release signing keystore (if GitHub Secrets are present)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, re

          b64 = os.environ.get("KEYSTORE_BASE64", "").strip()
          raw_props = os.environ.get("KEYSTORE_PROPERTIES", "").strip()
          ks_pass = os.environ.get("KEYSTORE_PASSWORD", "").strip()
          key_alias = os.environ.get("KEY_ALIAS", "").strip()
          key_pass = os.environ.get("KEY_PASSWORD", "").strip()

          # Parse fields from full keystore.properties secret if provided
          parsed = {}
          if raw_props:
              for line in raw_props.splitlines():
                  s = line.strip()
                  if not s or s.startswith("#") or s.startswith("!"):
                      continue
                  m = re.match(r'^([A-Za-z0-9_.-]+)\s*(?:[=:]|\s)\s*(.*)$', s)
                  if m:
                      parsed[m.group(1).strip()] = m.group(2).strip()

          final_store_pass = ks_pass or parsed.get("storePassword", "")
          final_alias = key_alias or parsed.get("keyAlias", "")
          final_key_pass = key_pass or parsed.get("keyPassword", "") or final_store_pass

          out_file = os.environ["GITHUB_OUTPUT"]
          if not b64 or not final_store_pass or not final_alias:
              print("No release signing secrets configured yet — building standard release APK.")
              with open(out_file, "a", encoding="utf-8") as fh:
                  fh.write("signed=false\n")
              raise SystemExit(0)

          # Support both PowerShell raw Base64 AND Windows `certutil -encode` PEM headers
          cleaned_lines = [
              ln.strip() for ln in b64.splitlines()
              if ln.strip() and not ln.strip().startswith("-----")
          ]
          keystore_bytes = base64.b64decode("".join(cleaned_lines))
          with open("release-keystore.jks", "wb") as kf:
              kf.write(keystore_bytes)

          def escape_prop(val: str) -> str:
              return val.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")

          with open("keystore.properties", "w", encoding="utf-8") as pf:
              pf.write("storeFile=release-keystore.jks\n")
              pf.write(f"storePassword={escape_prop(final_store_pass)}\n")
              pf.write(f"keyAlias={escape_prop(final_alias)}\n")
              pf.write(f"keyPassword={escape_prop(final_key_pass)}\n")

          print(f"Configured release keystore ({len(keystore_bytes)} bytes) with alias '{final_alias}'.")
          with open(out_file, "a", encoding="utf-8") as fh:
              fh.write("signed=true\n")
          PY

      - name: Build, test, and assemble release (R8)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :buildSrc:test :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease \
            --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Clean temporary signing files & prepare named APKs
        if: always()
        run: |
          rm -f release-keystore.jks keystore.properties
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
            VER="${{ steps.meta.outputs.version_name }}"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
              "$APKSIGNER" verify -v app/build/outputs/apk/release/app-release.apk
              cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/atlas-commerce.apk
              cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/atlas-commerce-v${VER}.apk"
            fi
          fi

      - name: Publish failure log
        if: steps.build.outcome == 'failure' && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -n 600 "$RUNNER_TEMP/build.log" > ci-logs/build.log
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-commerce-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Report build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed — see ci-logs/build.log on the branch."
          exit 1

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found - relying on AGP SDK auto-download"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify legacy 1.0.4 source quarantine, KSP release & Android Lint
        run: |
          mkdir -p app/src/main/java/ma/etherealmber/atlascommerce/push
          cat > app/src/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt <<'EOF'
          package ma.etherealmber.atlascommerce.push
          import com.google.firebase.messaging.FirebaseMessagingService
          import dagger.hilt.android.AndroidEntryPoint
          import javax.inject.Inject

          @AndroidEntryPoint
          class AtlasFirebaseMessagingService : FirebaseMessagingService() {
              @Inject lateinit var pushTokenRegistrar: PushTokenRegistrar
          }
          EOF
          cat > app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt <<'EOF'
          package ma.etherealmber.atlascommerce.di
          import dagger.Module
          import dagger.hilt.InstallIn
          import dagger.hilt.components.SingletonComponent

          @Module
          @InstallIn(SingletonComponent::class)
          object LegacyNetworkModule
          EOF
          touch -d '2026-10-21T20:08:04Z' app/src/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt
          touch -d '2026-10-21T20:08:04Z' app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt

          mv .git "$RUNNER_TEMP/hidden-git"
          gradle :app:kspReleaseKotlin :app:lintDebug --no-daemon --console=plain
          mv "$RUNNER_TEMP/hidden-git" .git

          test ! -e app/src/main/java/ma/etherealmber/atlascommerce/push
          test ! -e app/src/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt
          test -f .atlas-1.0.4-quarantine/main/java/ma/etherealmber/atlascommerce/push/AtlasFirebaseMessagingService.kt
          test -f .atlas-1.0.4-quarantine/main/java/ma/etherealmber/atlascommerce/di/LegacyNetworkModule.kt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  android14-smoke:
    name: Android 14 release APK launch & upgrade check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: atlas-commerce-release-apk
          path: release-apk

      - name: Sign release APK & launch on Android 14 (API 34) emulator
        id: smoke
        continue-on-error: true
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          ADB="$SDK_ROOT/platform-tools/adb"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          EMU_PID=""

          cleanup() {
            set +e
            "$ADB" emu kill </dev/null >/dev/null 2>&1 || true
            if [ -n "$EMU_PID" ]; then
              kill -9 "$EMU_PID" >/dev/null 2>&1 || true
            fi
            "$ADB" kill-server </dev/null >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          {
            export ANDROID_USER_HOME="$HOME/.android"
            export ANDROID_AVD_HOME="$HOME/.android/avd"
            mkdir -p "$ANDROID_AVD_HOME"

            if [ -e /dev/kvm ]; then
              sudo chmod 666 /dev/kvm
            fi

            yes | "$SDKM" --licenses </dev/null >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "emulator" "build-tools;35.0.0" "platforms;android-34" "system-images;android-34;google_apis;x86_64" </dev/null

            if [ -f release-apk/atlas-commerce.apk ] && "$APKSIGNER" verify release-apk/atlas-commerce.apk >/dev/null 2>&1; then
              echo "Using production-signed atlas-commerce.apk directly."
              cp release-apk/atlas-commerce.apk "$RUNNER_TEMP/app-release-signed.apk"
            else
              RAW_APK=$(ls release-apk/*.apk | head -n 1)
              keytool -genkeypair -v \
                -keystore "$RUNNER_TEMP/smoke.jks" \
                -alias smoke \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Atlas Release Smoke,O=Atlas,C=MA" </dev/null
              "$ZIPALIGN" -f -p 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
              "$APKSIGNER" sign \
                --ks "$RUNNER_TEMP/smoke.jks" \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out "$RUNNER_TEMP/app-release-signed.apk" \
                "$RUNNER_TEMP/aligned.apk"
              "$APKSIGNER" verify -v "$RUNNER_TEMP/app-release-signed.apk"
            fi

            "$ADB" start-server </dev/null >/dev/null 2>&1

            echo "no" | "$AVDM" create avd \
              --force \
              --name atlas_api34 \
              --package "system-images;android-34;google_apis;x86_64"

            "$SDK_ROOT/emulator/emulator" -list-avds

            "$SDK_ROOT/emulator/emulator" \
              -avd atlas_api34 \
              -no-window \
              -gpu swiftshader_indirect \
              -no-snapshot \
              -noaudio \
              -no-boot-anim \
              -memory 3072 </dev/null >"$RUNNER_TEMP/emulator.log" 2>&1 &
            EMU_PID=$!

            timeout 90 "$ADB" wait-for-device </dev/null
            BOOTED=0
            for i in $(seq 1 90); do
              if ! kill -0 "$EMU_PID" 2>/dev/null; then
                echo "Emulator exited prematurely:"
                cat "$RUNNER_TEMP/emulator.log"
                exit 1
              fi
              BOOT=$(timeout 10 "$ADB" shell getprop sys.boot_completed </dev/null 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = "1" ]; then
                BOOTED=1
                break
              fi
              sleep 2
            done
            if [ "$BOOTED" != "1" ]; then
              echo "Emulator failed to finish booting within 180s:"
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi

            timeout 15 "$ADB" shell input keyevent 82 </dev/null || true
            sleep 3

            # 1. Clean install & cold launch of R8-minified release APK on Android 14
            timeout 15 "$ADB" logcat -c </dev/null
            timeout 60 "$ADB" install -r "$RUNNER_TEMP/app-release-signed.apk" </dev/null
            timeout 30 "$ADB" shell am start -W -n ma.etherealmber.atlascommerce/.MainActivity </dev/null
            sleep 8

            timeout 20 "$ADB" logcat -d </dev/null > "$RUNNER_TEMP/smoke-logcat.txt"
            PID1=$(timeout 10 "$ADB" shell pidof ma.etherealmber.atlascommerce </dev/null | tr -d '\r' || true)
            echo "Android 14 cold launch PID: $PID1"

            if grep -Fq "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt"; then
              grep -A 50 -F "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt" > "$RUNNER_TEMP/smoke-failure.log"
              cat "$RUNNER_TEMP/smoke-failure.log"
              exit 1
            fi
            test -n "$PID1"

            timeout 20 "$ADB" shell uiautomator dump /sdcard/ui1.xml </dev/null
            timeout 10 "$ADB" shell cat /sdcard/ui1.xml </dev/null > "$RUNNER_TEMP/ui1.xml"
            grep -Fq "Atlas Commerce" "$RUNNER_TEMP/ui1.xml"

            # 2. Simulate upgrading over corrupted/legacy 1.0.4 DataStore on Android 14
            timeout 15 "$ADB" root </dev/null || true
            timeout 30 "$ADB" wait-for-device </dev/null
            sleep 2
            timeout 15 "$ADB" shell am force-stop ma.etherealmber.atlascommerce </dev/null
            timeout 15 "$ADB" shell "mkdir -p /data/data/ma.etherealmber.atlascommerce/files/datastore && printf 'corrupt-legacy-1.0.4-datastore-bytes\xff\x00\xfe' > /data/data/ma.etherealmber.atlascommerce/files/datastore/atlas_prefs.preferences_pb" </dev/null || true
            APP_UID=$(timeout 10 "$ADB" shell stat -c '%u:%g' /data/data/ma.etherealmber.atlascommerce </dev/null | tr -d '\r' || true)
            if [ -n "$APP_UID" ]; then
              timeout 10 "$ADB" shell "chown -R $APP_UID /data/data/ma.etherealmber.atlascommerce/files" </dev/null || true
            fi

            timeout 15 "$ADB" logcat -c </dev/null
            timeout 60 "$ADB" install -r "$RUNNER_TEMP/app-release-signed.apk" </dev/null
            timeout 30 "$ADB" shell am start -W -n ma.etherealmber.atlascommerce/.MainActivity </dev/null
            sleep 8

            timeout 20 "$ADB" logcat -d </dev/null >> "$RUNNER_TEMP/smoke-logcat.txt"
            PID2=$(timeout 10 "$ADB" shell pidof ma.etherealmber.atlascommerce </dev/null | tr -d '\r' || true)
            echo "Android 14 post-upgrade launch PID: $PID2"

            if grep -Fq "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt"; then
              grep -A 50 -F "AndroidRuntime: FATAL EXCEPTION" "$RUNNER_TEMP/smoke-logcat.txt" > "$RUNNER_TEMP/smoke-failure.log"
              cat "$RUNNER_TEMP/smoke-failure.log"
              exit 1
            fi
            test -n "$PID2"

            timeout 20 "$ADB" shell uiautomator dump /sdcard/ui2.xml </dev/null
            timeout 10 "$ADB" shell cat /sdcard/ui2.xml </dev/null > "$RUNNER_TEMP/ui2.xml"
            grep -Fq "Atlas Commerce" "$RUNNER_TEMP/ui2.xml"
          } > "$RUNNER_TEMP/smoke-step.log" 2>&1

      - name: Publish smoke failure log
        if: steps.smoke.outcome == 'failure' && github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -n 300 "$RUNNER_TEMP/smoke-step.log" > ci-logs/smoke-step.log || true
          tail -n 500 "$RUNNER_TEMP/smoke-logcat.txt" > ci-logs/android14-logcat.log || true
          tail -n 120 "$RUNNER_TEMP/emulator.log" > ci-logs/emulator.log || true
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/
          git commit -m "ci: android 14 smoke log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Android 14 logcat & UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-smoke-diagnostics
          path: |
            ${{ runner.temp }}/smoke-logcat.txt
            ${{ runner.temp }}/ui1.xml
            ${{ runner.temp }}/ui2.xml
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore

      - name: Report Android 14 smoke result
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Android 14 release launch smoke test failed — see ci-logs/ on branch."
          exit 1

  publish-release:
    name: Publish signed APK to GitHub Releases
    needs: [build, lint, android14-smoke]
    if: >-
      needs.build.outputs.signed == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-commerce-release-apk
          path: signed-apk

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          TAG="v${VERSION_NAME}"
          NOTES="Atlas Commerce Android ${TAG} (build ${VERSION_CODE}) — APK signé prêt à installer."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              signed-apk/atlas-commerce.apk \
              "signed-apk/atlas-commerce-v${VERSION_NAME}.apk" \
              --clobber
          else
            gh release create "$TAG" \
              signed-apk/atlas-commerce.apk \
              "signed-apk/atlas-commerce-v${VERSION_NAME}.apk" \
              --title "Atlas Commerce ${TAG}" \
              --notes "$NOTES"
          fi
